# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF SQL Injection (Union) (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask page viewer that builds its SQLite query from the page id in the URL (union-based SQL injection). The SKF lab folder python/SQLI is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-sqli

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.130.0/24, internet: false}

machines:
  web:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {db: /home/app/SQLI/config}     # config/Database.db, shared with ctf/flag.sh, which adds the flags table at every start
    ports:
      web:
        port: 5000
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: a page is read from the database by its id in the URL
    script: checks/page.sh

message: |
  OWASP SKF SQL Injection (Union) answers at {{ machines.web.ports.web.url }}.
  Pages are read by id from /home/<id>: what does the database do with an id that is not a number?
